# Quand des PDF ou le script changent : vérifie que data/collectes.json a bien été
# régénéré, et affiche le rapport de contrôle dans le résumé du workflow.
name: Calendrier

on:
  push:
    paths: ["sources/**", "tools/build_calendar.py", "data/**"]
  pull_request:
    paths: ["sources/**", "tools/build_calendar.py", "data/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Dépendances
        run: pip install -r tools/requirements.txt
      - name: Conversion des PDF
        run: python tools/build_calendar.py --output build
      - name: Rapport de contrôle
        run: cat build/rapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: data/collectes.json est-il à jour ?
        run: |
          python - <<'PY'
          import json, sys
          def load(path):
              data = json.load(open(path, encoding="utf-8"))
              data.pop("generated_at", None)
              return data
          if load("data/collectes.json") != load("build/collectes.json"):
              print("::error file=data/collectes.json::Fichier obsolète : lancez python tools/build_calendar.py puis commitez data/")
              sys.exit(1)
          print("data/collectes.json est à jour.")
          PY
